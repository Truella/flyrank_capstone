<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="card-header">
      <h1>We value your feedback</h1>
      <p>Tell us how we're doing. It takes less than a minute.</p>
    </header>

    <form id="feedback-form" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Jane Doe" autocomplete="name" />
        <small class="error" data-error-for="name"></small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="jane@example.com" autocomplete="email" />
        <small class="error" data-error-for="email"></small>
      </div>

      <div class="field">
        <label for="category">What are you giving feedback about?</label>
        <select id="category" name="category">
          <option value="" selected disabled>Select a topic…</option>
          <option value="product">Product</option>
          <option value="service">Customer service</option>
          <option value="website">Website / app</option>
          <option value="delivery">Delivery</option>
          <option value="other">Something else</option>
        </select>
        <small class="error" data-error-for="category"></small>
      </div>

      <div class="field">
        <label for="rating">Overall rating</label>
        <select id="rating" name="rating">
          <option value="" selected disabled>Choose a rating…</option>
          <option value="5">Excellent</option>
          <option value="4">Good</option>
          <option value="3">Average</option>
          <option value="2">Poor</option>
          <option value="1">Terrible</option>
        </select>
        <small class="error" data-error-for="rating"></small>
      </div>

      <div class="field">
        <label for="message">Comments</label>
        <textarea id="message" name="message" rows="4" placeholder="Share the details…"></textarea>
        <small class="error" data-error-for="message"></small>
      </div>

      <div class="field">
        <label for="contact">May we contact you about this?</label>
        <select id="contact" name="contact">
          <option value="" selected disabled>Select an option…</option>
          <option value="yes">Yes, feel free to reach out</option>
          <option value="no">No, thanks</option>
        </select>
        <small class="error" data-error-for="contact"></small>
      </div>

      <div class="field checkbox-field">
        <input type="checkbox" id="subscribe" name="subscribe" />
        <label for="subscribe" class="checkbox-label">Subscribe to our newsletter</label>
      </div>

      <button type="submit" class="submit-btn">Submit feedback</button>
    </form>

    <div id="success" class="success" hidden>
      <h2>Thank you!</h2>
      <p>Your feedback has been submitted. We appreciate you taking the time to share it.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
