<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Send feedback about the product. Report bugs, request features, or share general thoughts." />
  <title>Feedback Form</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <main id="main" class="page-shell">
    <div class="feedback-card">
      <header class="form-header">
        <h1 class="form-title">We'd love your feedback</h1>
        <p class="form-subtitle">
          Tell us what went well, what could be improved, or anything else you'd like to share.
        </p>
      </header>

      <form id="feedback-form" class="field-grid" novalidate>
        <div class="field">
          <label class="field-label" for="name">
            Name <span class="optional-mark">(optional)</span>
          </label>
          <input
            class="form-control"
            type="text"
            id="name"
            name="name"
            autocomplete="name"
            placeholder="Jane Doe"
          />
        </div>

        <div class="field">
          <label class="field-label" for="email">
            Email <span class="optional-mark">(optional)</span>
          </label>
          <input
            class="form-control"
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            inputmode="email"
            placeholder="you@example.com"
            aria-describedby="email-error"
          />
          <p class="error-message" id="email-error"></p>
        </div>

        <div class="field">
          <label class="field-label" for="category">
            Feedback Category <span class="required-mark" aria-hidden="true">*</span>
          </label>
          <select class="form-control form-select" id="category" name="category" required aria-describedby="category-error">
            <option value="" selected disabled>Select a category</option>
            <option value="bug-report">Bug Report</option>
            <option value="feature-request">Feature Request</option>
            <option value="general-feedback">General Feedback</option>
            <option value="question">Question</option>
            <option value="other">Other</option>
          </select>
          <p class="error-message" id="category-error"></p>
        </div>

        <div class="field">
          <label class="field-label" for="type">
            Feedback Type <span class="required-mark" aria-hidden="true">*</span>
          </label>
          <select
            class="form-control form-select"
            id="type"
            name="type"
            required
            disabled
            aria-describedby="type-error"
          >
            <option value="" selected>Select a category first</option>
          </select>
          <p class="error-message" id="type-error"></p>
        </div>

        <div class="field span-2">
          <label class="field-label" for="message">
            Feedback Message <span class="required-mark" aria-hidden="true">*</span>
          </label>
          <textarea
            class="form-control"
            id="message"
            name="message"
            rows="5"
            required
            placeholder="Describe your experience, the issue you encountered, or the suggestion you have in mind..."
            aria-describedby="message-error"
          ></textarea>
          <p class="error-message" id="message-error"></p>
        </div>

        <div class="span-2">
          <button type="submit" id="submit-button" class="submit-button" disabled>
            Submit Feedback
          </button>
          <p class="success-message" id="success-message" role="status" hidden>
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5" />
            </svg>
            <span>Thank you! Your feedback has been submitted.</span>
          </p>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
